            return '<div class="dim-row"><span>' + k + '</span><div class="dim-bar"><i style="width:' + pct + '%"></i></div><b>' + dims[k] + "</b></div>";
          }).join("") : '<p class="note">还没有错题，保持住。</p>'}
          ${keys.length ? '<p class="note">建议优先练「' + keys[0] + '」类题目，建议下一组题里多放这一类。</p>' : ""}
        </div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h3>推荐策略</h3>
        <p class="note">当前推荐带 <b>${lo + 20}–${hi + 40}</b>，难度按你最近一次作答的表现微调；同一题材连续读满 5 篇后，会强制换一个题材，避免偏食。</p>
        <div class="chips" style="margin-top:14px">
          ${Object.keys(TOPICS).slice(0, 4).map(function (t) { return '<span class="chip">' + TOPICS[t].name + "</span>"; }).join("")}
        </div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h3>最近记录</h3>
        ${hist.length ? hist.slice(0, 5).map(function (h) {
          const a = byId(h.id);
          return '<div class="kv"><span>' + (a ? a.title : h.id) + "</span><b>" + h.correct + "/" + h.total + " · " + (h.delta >= 0 ? "+" : "") + h.delta + " LX</b></div>";
        }).join("") : '<p class="note">还没有阅读记录。</p>'}
      </div>
    </div>
  </div>`;
}

function bindProfile() {}

/* ---------------- 答题 ---------------- */
  function viewQuiz(id) {
    const a = byId(id);
    const qs = Q(id);
    if (!state.session || state.session.id !== id) state.session = { id, i: 0, answers: {} };
    const s = state.session;
    const q = qs[s.i];
    const dots = qs.map((_, i) => `<i class="${i === s.i ? "on" : i < s.i ? "done" : ""}"></i>`).join("");
    const opts = q.options.map((o, i) => `
      <li><button class="option ${s.answers[s.i] === i ? "is-picked" : ""}" data-i="${i}" type="button">
        <b>${"ABCD"[i]}</b><span>${o}</span>
      </button></li>`).join("");

    return `
    <div class="quiz-wrap">
      <div class="container">
        <section class="quiz">
          <div class="quiz__head">
            <span class="quiz__step">${s.i + 1} / ${qs.length}</span>
            <div class="dots">${dots}</div>
          </div>
          <p class="quiz__type">${q.dim} · ${q.skill} · LX ${a.lx}</p>
          <h2 class="quiz__q">${q.q}</h2>
          <ul class="options" id="options">${opts}</ul>
          <div class="quiz__foot">
            <button class="btn btn--ghost btn--sm" id="peek" type="button">查看原文</button>
            <button class="btn" id="next" type="button" ${s.answers[s.i] == null ? "disabled style=\"opacity:.45\"" : ""}>${s.i === qs.length - 1 ? "看结果" : "下一题"}</button>
          </div>
          <div id="peekBox" hidden style="margin-top:26px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:16px;font-family:Georgia,serif;font-size:14.5px;line-height:1.85;color:var(--ink-2)">
            ${a.paras.map((p) => `<p style="margin-bottom:12px">${p.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g, "$1")}</p>`).join("")}
          </div>
        </section>
      </div>
    </div>`;
  }

  document.addEventListener("click", (e) => {
    const opt = e.target.closest("#options .option");
    if (opt) {
      state.session.answers[state.session.i] = +opt.dataset.i;
      document.querySelectorAll("#options .option").forEach((b) => b.classList.remove("is-picked"));
      opt.classList.add("is-picked");
      const next = $("#next");
      next.disabled = false;
      next.style.opacity = "";
    }
    if (e.target.closest("#next")) {
      const s = state.session;
      if (s.answers[s.i] == null) return;
      if (s.i < Q(s.id).length - 1) {
        s.i++;
        render();
      } else {
        location.hash = "#/result/" + s.id;
      }
    }
    if (e.target.closest("#peek")) {
      const box = $("#peekBox");
      box.hidden = !box.hidden;
      e.target.textContent = box.hidden ? "查看原文" : "收起原文";
    }
    if (e.target.closest("#toQuiz")) {
      state.session = { id: location.hash.split("/").pop(), i: 0, answers: {} };
      location.hash = "#/quiz/" + state.session.id;
    }
  });

  /* ---------------- 结果 ---------------- */
  function computeResult(id, answers) {
    const a = byId(id);
    const qs = Q(id);
    let ra = USER.c;
    let correct = 0;
    qs.forEach((q, i) => {
      const E = 0.25 + 0.75 / (1 + Math.exp(-(ra - (a.lx + (bias[q.skill] || 0))) / 174));
      const ok = answers[i] === q.answer;
      if (ok) correct++;
      ra += 28 * ((ok ? 1 : 0) - E);
    });
    return {
      id, correct, total: qs.length,
      delta: Math.round(ra - USER.c),
      cNew: Math.round(ra),
      hNew: Math.round(400 / Math.sqrt(25)),
      wrong: qs.map((q, i) => ({ q, i, picked: answers[i] })).filter((x) => x.picked !== x.q.answer)
    };
  }

  function demoAnswers(id) {
    const out = {};
    Q(id).forEach((q, i) => { out[i] = i === 3 ? (q.answer + 1) % 4 : q.answer; });
    return out;
  }

  function viewResult(id) {
    let s = state.session;
    if (!s || s.id !== id) s = state.session = { id, i: 0, answers: demoAnswers(id) };
    const r = computeResult(id, s.answers);
    const a = byId(id);
    const pct = Math.round((r.correct / r.total) * 100);
    const dash = 2 * Math.PI * 62;
    const keys = [...new Set((a.paras.join(" ").match(/\{([^}|]+)(?:\|([^}]+))?\}/g) || []).map((m) => {
      const inner = m.slice(1, -1).split("|");
      return (inner[1] || inner[0]).toLowerCase();
    }))];
    const litCount = keys.length;
    const totalStars = STARS.length;

    const allQ = Q(id);
    const dims = ["定位与提取", "整合与解释", "评价与反思"].map(function (d) {
      let t = 0, c = 0;
      allQ.forEach(function (q, i) { if (q.dim === d) { t++; if (s.answers[i] === q.answer) c++; } });
      return { d: d, t: t, c: c };
    }).filter(function (x) { return x.t > 0; });
    const dimHTML = dims.map(function (x) {
      const pct = Math.round((x.c / x.t) * 100);
      return `<div class="dim-row"><span>${x.d}</span><div class="dim-bar"><i style="width:${pct}%"></i></div><b>${x.c}/${x.t}</b></div>`;
    }).join("");

    const errors = r.wrong.length
      ? r.wrong.map(({ q, picked }) => `
        <div style="margin-top:${errorsGap()}">
          <span class="tag">${q.dim} · ${q.skill}</span>
          <p style="margin-top:14px;font-size:14px;color:var(--ink-2);line-height:1.7">你选了 <b>${"ABCD"[picked]}</b>，正确答案是 <b>${"ABCD"[q.answer]}</b>。${q.explain}</p>
          <div class="evidence"><mark>${q.evidence}</mark></div>
        </div>`).join("")
      : `<p style="margin-top:16px;font-size:14px;color:var(--muted)">全部答对，这一篇没有留下错因。可以挑战更高一档的难度了。</p>`;

    const chips = keys.map((w) => `<span class="chip">${w}</span>`).join("");

    return `
    <div class="result-wrap">
      <div class="container">
        <section class="result">
          <div class="result__hero">
            <div class="ring">
              <svg width="150" height="150" viewBox="0 0 150 150">
                <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(244,233,210,.14)" stroke-width="6"/>
                <circle id="ringArc" data-pct="${pct}" cx="75" cy="75" r="62" fill="none" stroke="#E4C88A" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${dash}" />
              </svg>
              <div class="ring__num"><div><b>${pct}%</b><span>${r.correct} / ${r.total} 题</span></div></div>
            </div>
            <div class="result__facts">
              <p class="result__label">能力变化</p>
              <div class="result__delta"><b>+${r.delta}</b><span>LX</span></div>
              <p class="result__range">${USER.c - USER.h}–${USER.c + USER.h}<i>→</i>${r.cNew - r.hNew}–${r.cNew + r.hNew}</p>
              <p class="result__note">半宽 ${USER.h} → ${r.hNew}，本次错 ${r.total - r.correct} 题</p>
            </div>
          </div>

          <div class="result__stars">
            <div style="display:flex;gap:6px">
              ${Array.from({ length: litCount }).map((_, i) => `<span class="ignite" style="transition-delay:${360 + i * 140}ms">✦</span>`).join("")}
            </div>
            <p>本次点亮 <b>${litCount}</b> 颗新星 · 星图进度 <b>${totalStars}</b> → <b>${totalStars + litCount}</b></p>
          </div>

          <div class="result__cards">
            <div class="panel">
              <h3>错因归因</h3>
              <div class="dims">${dimHTML}</div>
              <p class="dims-note">按 PISA 阅读素养三维度统计</p>
              ${errors}
            </div>
            <div class="panel">
              <h3>本次新词</h3>
              <p style="margin-top:12px;font-size:13px;color:var(--muted);line-height:1.7">点过的词已进入词汇本，星图上会亮起对应的星。</p>
              <div class="chips">${chips || '<span class="chip">canopy</span>'}</div>
              <a class="btn btn--sm" href="#/galaxy" style="margin-top:24px;width:100%">去星河看看</a>
            </div>
          </div>

          <div class="next-card">
            <div>
              <h3>下一篇 · ${ARTICLES[1].title}</h3>
              <p>LX ${ARTICLES[1].lx} · 推荐区间 ${USER.c - 45}–${USER.c + 55} · ${ARTICLES[1].reason}</p>
            </div>
            <a class="btn" href="#/read/a2">开始阅读</a>
          </div>
        </section>
      </div>
    </div>`;
  }

  function errorsGap() { return "26px"; }

  /* ==========================================================

/* ---------------- 通用：抽屉 + 轻提示 ---------------- */
function ensureOverlay() {
  if (document.getElementById("sheetMask")) return;
  const mask = document.createElement("div");
  mask.id = "sheetMask";
  mask.className = "sheet-mask";
  const sheet = document.createElement("aside");
  sheet.id = "sheet";
  sheet.className = "sheet";
  document.body.appendChild(mask);
  document.body.appendChild(sheet);
  mask.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
}

let sheetOpenedAt = 0;

function openSheet(html) {
  ensureOverlay();
  const sheet = document.getElementById("sheet");
  const mask = document.getElementById("sheetMask");
  sheet.innerHTML = html;
  sheetOpenedAt = Date.now();
  setTimeout(function () {
    sheet.classList.add("on");
    mask.classList.add("on");
  }, 10);
}

function closeSheet() {
  const sheet = document.getElementById("sheet");
  const mask = document.getElementById("sheetMask");
  if (!sheet) return;
  sheet.classList.remove("on");
  mask.classList.remove("on");
}

function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add("on"));
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 1900);
}

function masteryDots(p, n) {
  const on = Math.round(p * (n || 5));
  return `<span class="mastery">${[0, 1, 2, 3, 4].map((i) => `<i class="${i < on ? "on" : ""}"></i>`).join("")}</span>`;
}

function speak(text, lang) {
  try {
    if (!window.speechSynthesis) { toast("当前浏览器不支持发音"); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { toast("发音不可用"); }
}

/* ---------------- 首次进入：定级与词汇量测试 ---------------- */
function saveProfile() {
  try {
    localStorage.setItem("dianliang.profile", JSON.stringify({
      onboarded: true, segment: USER.segment, goal: USER.goal,
      c: USER.c, h: USER.h, vocabEstimate: USER.vocabEstimate
    }));
  } catch (e) {}
}

function loadProfile() {
  try {
    const raw = localStorage.getItem("dianliang.profile");
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (!p || !p.onboarded) return false;
    USER.onboarded = true;
    USER.segment = p.segment || USER.segment;
    USER.goal = p.goal || USER.goal;
    if (p.c) USER.c = p.c;
    if (p.h) USER.h = p.h;
    if (p.vocabEstimate) USER.vocabEstimate = p.vocabEstimate;
    return true;
  } catch (e) { return false; }
}

function lxFromVocab(v) {
  const t = [[800, 300], [1500, 420], [2500, 520], [3500, 600], [4500, 680], [6000, 770], [8000, 880], [10000, 980]];
  if (v <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) {
    if (v <= t[i][0]) {
      const a = t[i - 1], b = t[i];
      return Math.round(a[1] + ((v - a[0]) / (b[0] - a[0])) * (b[1] - a[1]));
    }
  }
  return 1050;
}

function bindWelcome() {
  const st = state.place;
  const segBtn = document.querySelector("[data-seg]");
  if (segBtn) {
    document.querySelectorAll("[data-seg]").forEach(function (b) {
      b.addEventListener("click", function () {
        const key = b.dataset.seg;
        USER.segment = key;
        USER.goal = SEGMENTS[key].name;
        const bank = PLACEMENT_BANK[key] || PLACEMENT_BANK.cet;
        const real = shuffle(bank.real.slice()).map(function (x) { return { w: x[0], fake: false, lv: x[1] }; });
        const fake = shuffle(bank.fake.slice()).map(function (w) { return { w: w, fake: true, lv: 0 }; });
        st.items = shuffle(real.concat(fake));
        st.seg = key; st.idx = 0; st.known = 0; st.score = 0; st.fakeHit = 0; st.step = 2;
        render();
      });
    });
  }
  const skip = document.querySelector("[data-skip]");
  if (skip) skip.addEventListener("click", function () {
    USER.onboarded = true;
    saveProfile();
    navigate("#/home");
  });

  document.querySelectorAll("[data-know]").forEach(function (b) {
    b.addEventListener("click", function () {
      const it = st.items[st.idx];
      const know = b.dataset.know === "1";
      if (it.fake) { if (know) st.fakeHit++; }
      else if (know) { st.known++; st.score += it.lv; }
      st.idx++;
      if (st.idx >= st.items.length) {
        const seg = SEGMENTS[st.seg];
        const totalLv = st.items.reduce(function (n, x) { return n + (x.fake ? 0 : x.lv); }, 0) || 1;
        const ratio = st.score / totalLv;
        const penalty = Math.min(0.25, st.fakeHit * 0.08);
        const vocab = Math.round((seg.base + ratio * seg.span) * (1 - penalty));
        const lx = lxFromVocab(vocab);
        USER.vocabEstimate = vocab;
        USER.c = lx;
        USER.h = 100;
        USER.confidence = "低";
        USER.onboarded = true;
        saveProfile();
        st.step = 3;
      }
      render();
    });
  });

  const start = document.querySelector("[data-start]");
  if (start) start.addEventListener("click", function () { navigate("#/home"); });
  const retry = document.querySelector("[data-retry]");
  if (retry) retry.addEventListener("click", function () { state.place = null; render(); });
}

/* ---------------- 词汇本 ---------------- */
function wordsData() {
  return STARS.map(function (x) {

      w: x[0], t: x[1], p: state.vocab[x[0]] ? state.vocab[x[0]].p : x[2],
      st: (state.vocab[x[0]] ? state.vocab[x[0]].p : x[2]) < 0.3 ? "未知" : (state.vocab[x[0]] ? state.vocab[x[0]].p : x[2]) < 0.6 ? "模糊" : "已掌握",
      mean: wordMean(x[0]) || "—",

function collectedWords() {

}

function renderWordList() {
  const box = $("#wordList");
  if (!box) return;
  let rows = wordsData();
  if (state.wordTab === "生词本") rows = rows.filter(function (r) { return r.on; });
  else if (state.wordTab !== "全部") rows = rows.filter(function (r) { return r.st === state.wordTab; });
  if (state.wordQuery) {
    const q = state.wordQuery.toLowerCase();
    rows = rows.filter(function (r) { return r.w.indexOf(q) > -1 || r.mean.indexOf(state.wordQuery) > -1; });
  }
  if (state.wordSort === "alpha") rows.sort(function (a, b) { return a.w.localeCompare(b.w); });
  else if (state.wordSort === "weak") rows.sort(function (a, b) { return a.p - b.p; });

  if (!rows.length) {
    box.innerHTML = state.wordTab === "生词本"
      ? '<div class="empty">生词本还是空的。读文章时点单词，在卡片里点「加入生词本」就会收进来。</div>'
      : '<div class="empty">没有符合条件的词。</div>';
    return;
  }
  box.innerHTML = rows.map(function (r) {
    return '<div class="word-row" data-w="' + r.w + '" tabindex="0">' +
      '<div class="word-row__w">' + r.w + "</div>" +
      '<div class="word-row__s">' + r.mean + " · 来自《" + sourceOf(r.w) + "》</div>" +
      '<div class="word-row__st ' + (r.p < 0.3 ? "st-new" : r.p < 0.6 ? "st-fuzzy" : "st-known") + '">' + r.st + masteryDots(r.p) + "</div>" +
      "</div>";
  }).join("");
}

/* ---------------- 复习模式（百词斩式轮回复习） ---------------- */
function reviewCandidates() {
  const col = collectedWords();
  if (col.length) return col;
  return STARS.filter(function (s) {
    const p = state.vocab[s[0]] ? state.vocab[s[0]].p : s[2];
    return p < 0.6;
  }).map(function (s) { return s[0]; });
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startReview(list) {
  if (!list || !list.length) { toast("没有需要复习的词，去读一篇新文章吧"); return; }
  const items = list.length === 1 ? [list[0], list[0], list[0]] : list;
  state.review = {
    queue: items.map(function (w) { return { w: w, tries: 0 }; }),
    total: items.length,
    done: 0,
    correct: 0,
    phase: "ask",
    last: null,
    mode: 0
  };
  reviewRender();
}

function reviewOptions(w, mode) {
  const correct = mode === "en2zh" ? (WORDS[w] && WORDS[w].mean) : w;
  const others = [];
  const pool = shuffle(STARS.map(function (s) { return s[0]; }).filter(function (x) { return x !== w; }));
  for (let i = 0; i < pool.length && others.length < 3; i++) {
    const v = mode === "en2zh" ? (WORDS[pool[i]] && WORDS[pool[i]].mean) : pool[i];
    if (v && v !== correct && others.indexOf(v) === -1) others.push(v);
  }
  return shuffle([correct].concat(others));
}

function reviewRender() {
  const rv = state.review;
  if (!rv) return;
  let el = document.getElementById("review");
  if (!el) {
    el = document.createElement("div");
    el.id = "review";
    el.className = "review";
    document.body.appendChild(el);
  }
  el.classList.add("on");
  const total = rv.total;

  if (!rv.queue.length) {
    el.innerHTML = `
      <div class="review__card review__done">
        <p class="eyebrow">REVIEW DONE</p>
        <h2>这一轮复习完成</h2>
        <p class="review__sum">共 ${total} 个词 · 一次答对 <b>${rv.correct}</b> 个 · 正确率 ${Math.round((rv.correct / total) * 100)}%</p>
        <p class="review__tip">答错的词已更新掌握度，下一轮会再出现。</p>
        <div class="review__actions">
          <button class="btn" data-rvclose type="button">回到词汇本</button>
        </div>
      </div>`;
    return;
  }

  const cur = rv.queue[0];
  const w = cur.w;
  const info = WORDS[w] || {};
  const topic = info.topic || "tech";
  const progress = Math.round(((total - rv.queue.length) / total) * 100);
  const img = '<div class="rv__img" style="color:' + TOPICS[topic].color + '"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (IMG[info.img] || IMG.books) + "</svg></div>";
  const pos = info.pos ? '<span class="rv__pos">' + info.pos + "</span>" : "";
  const sayWord = '<button class="say rv__say" data-say="' + w + '" data-lang="en-US" type="button" title="朗读单词">🔊</button>';
  const sayEx = info.ex ? '<button class="say rv__say" data-say="' + info.ex.replace(/"/g, "&quot;") + '" data-lang="en-US" type="button" title="朗读例句">🔊</button>' : "";

  if (rv.phase === "feedback") {
    const ok = rv.last.ok;
    el.innerHTML = `
      <div class="review__bar"><i style="width:${progress}%"></i></div>
      <div class="review__card rv ${ok ? "is-ok" : "is-no"}">
        <p class="rv__mark">${ok ? "✓" : "✕"}</p>
        ${img}
        <h2 class="rv__word">${w}${sayWord}</h2>
        <p class="rv__meta">${pos}<span>${info.mean || ""}</span></p>
        ${info.ex ? `<p class="rv__ex">${sayEx}<span>${info.ex}</span></p><p class="rv__exzh">${info.exZh || ""}</p>` : ""}
        ${ok ? "" : '<p class="review__tip">这个会回到队尾，再考你一次</p>'}
        <div class="rv__actions"><button class="btn" data-rvnext type="button">继续</button></div>
      </div>`;
    return;
  }

  const modeNames = { en2zh: "看词选义", zh2en: "看义选词", spell: "拼写", listen: "听音选词" };
  const mode = ["en2zh", "zh2en", "spell", "listen"][rv.mode % 4];
  let body = "";

  if (mode === "spell") {
    body = `
      ${img}
      <p class="rv__ask">${info.mean || ""} ${pos}</p>
      <input class="review__input" id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入这个单词" />
      <p class="review__hint">${w.length} 个字母 · 首字母 ${w[0].toUpperCase()}</p>
      <div class="rv__actions"><button class="btn" id="spellGo" type="button">检查</button></div>`;
  } else if (mode === "listen") {
    const opts = reviewOptions(w, "zh2en").map(function (o, i) {
      return '<button class="review__opt" data-rvopt="' + o + '" type="button"><b>' + "ABCD"[i] + "</b>" + o + "</button>";
    }).join("");
    body = `
      ${img}
      <button class="review__play" data-rvsay="${w}" type="button">♪ 播放发音</button>
      <p class="rv__ask">听发音，选出正确的单词</p>
      <div class="review__opts">${opts}</div>`;
  } else if (mode === "zh2en") {
    const opts = reviewOptions(w, mode).map(function (o, i) {
      return '<button class="review__opt" data-rvopt="' + o + '" type="button"><b>' + "ABCD"[i] + "</b>" + o + "</button>";
    }).join("");
    body = `
      ${img}
      <p class="rv__ask">${info.mean || ""}</p>
      <p class="rv__meta rv__meta--center">${pos}</p>
      <div class="review__opts">${opts}</div>`;
  } else {
    const opts = reviewOptions(w, mode).map(function (o, i) {
      return '<button class="review__opt" data-rvopt="' + o + '" type="button"><b>' + "ABCD"[i] + "</b>" + o + "</button>";
    }).join("");
    body = `
      ${img}
      <h2 class="rv__word">${w}${sayWord}</h2>
      <p class="rv__meta rv__meta--center">${pos}<span>${info.uk || ""}</span></p>
      <div class="review__opts">${opts}</div>`;
  }

  el.innerHTML = `
    <div class="review__bar"><i style="width:${progress}%"></i></div>
    <button class="review__close" data-rvclose type="button">×</button>
    <div class="review__card rv">
      <p class="review__count">${modeNames[mode]} · 还剩 ${rv.queue.length} 个</p>
      ${body}
    </div>`;

  if (mode === "listen") setTimeout(function () { speak(w, "en-US"); }, 380);
}

function reviewAnswer(value) {
  const rv = state.review;
  if (!rv || rv.phase === "feedback") return;
  const cur = rv.queue[0];
  const w = cur.w;
  const mode = ["en2zh", "zh2en", "spell", "listen"][rv.mode % 4];
  const correctVal = mode === "en2zh" ? (WORDS[w] && WORDS[w].mean) : w;
  const ok = String(value).trim().toLowerCase() === String(correctVal).trim().toLowerCase();

  rv.mode++;
  if (ok) {
    rv.correct++;
    rv.queue.shift();
    if (state.vocab[w]) state.vocab[w].p = Math.min(0.95, state.vocab[w].p + 0.12);
  } else {
    cur.tries++;
    rv.queue.shift();
    if (cur.tries < 2) rv.queue.push(cur);
    if (state.vocab[w]) state.vocab[w].p = Math.max(0.05, state.vocab[w].p - 0.15);
  }
  rv.last = { ok: ok };
  rv.phase = "feedback";
  reviewRender();
}

document.addEventListener("click", function (e) {
  const opt = e.target.closest("[data-rvopt]");
  if (opt) { reviewAnswer(opt.dataset.rvopt); return; }
  if (e.target.closest("[data-rvsay]")) {
    speak(e.target.closest("[data-rvsay]").dataset.rvsay, "en-US");
    return;
  }
  if (e.target.closest("[data-rvnext]")) {
    const rv = state.review;
    if (!rv) return;
    rv.phase = "ask";
    reviewRender();
    return;
  }
  if (e.target.closest("#spellGo")) {
    const inp = document.getElementById("spellInput");
    if (inp && inp.value.trim()) reviewAnswer(inp.value);
    return;
  }
  if (e.target.closest("[data-rvclose]")) {
    const el = document.getElementById("review");
    if (el) el.classList.remove("on");
    setTimeout(function () { const x = document.getElementById("review"); if (x) x.remove(); }, 300);
    state.review = null;
    if (location.hash.indexOf("words") > -1 || state.route === "#/words") renderWordList();
  }
});

/* ---------------- 我的 ---------------- */
function vocabFromLx(lx) {
  const t = [[800, 300], [1500, 420], [2500, 520], [3500, 600], [4500, 680], [6000, 770], [8000, 880], [10000, 980]];
  if (lx <= t[0][1]) return 800;
  for (let i = 1; i < t.length; i++) {
    if (lx <= t[i][1]) {
      const a = t[i - 1], b = t[i];
      return Math.round(a[0] + ((lx - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
    }
  }
  return 10000;
}

function statNow() {
  const looked = Object.keys(state.looked);
  const col = Object.keys(state.collected);
  const stars = STARS.filter(function (x) {
    return (state.vocab[x[0]] ? state.vocab[x[0]].p : x[2]) > 0.02;
  }).length;
  const mastered = STARS.filter(function (x) {
    return (state.vocab[x[0]] ? state.vocab[x[0]].p : x[2]) >= 0.6;
  }).length;
  return { stars: stars, mastered: mastered, vocab: USER.vocabEstimate, days: USER.streak };
}

function sourceOf(w) {
  for (let i = 0; i < ARTICLES.length; i++) {
    const a = ARTICLES[i];
    if (a.paras.join(" ").toLowerCase().indexOf(w.toLowerCase()) > -1) return a.title;
  }
  return "词库";
}

    let i = 0;
    const t = setInterval(function () {
      i++;

      if (i >= steps.length) {
        clearInterval(t);
        setTimeout(function () {

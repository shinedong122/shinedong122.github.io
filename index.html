<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<title>点亮繁星阅读 · 测准蓝思，点亮成长</title>
<style>
/* =========================================================
   点亮繁星阅读 · 设计系统
   Paper (light) ↔ Night (dark) —— 纸上是阅读，夜空是成长
   ========================================================= */

:root{
  --paper:#FAF7F0;
  --paper-2:#F2EDE2;
  --paper-3:#EFE8DA;
  --ink:#171C26;
  --ink-2:#3C4452;
  --muted:#8A8273;
  --line:rgba(23,28,38,.10);
  --line-2:rgba(23,28,38,.16);
  --gold:#A9833F;
  --gold-2:#C9A158;
  --gold-3:#E4C88A;
  --navy:#131E36;
  --navy-2:#1D2C4C;

  --void:#05080F;
  --night:#0A1020;
  --night-2:#101A31;
  --star:#F4E9D2;
  --star-dim:rgba(244,233,210,.62);

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --shadow-1:0 1px 2px rgba(23,28,38,.04), 0 12px 28px -18px rgba(23,28,38,.22);
  --shadow-2:0 2px 6px rgba(23,28,38,.05), 0 28px 60px -28px rgba(23,28,38,.30);
  --ease:cubic-bezier(.22,.72,.18,1);
  --serif:"Songti SC","STSong","SimSun",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Microsoft YaHei UI",-apple-system,"Segoe UI",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 15px/1.7 var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:rgba(201,161,88,.28)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--gold-2); outline-offset:3px; border-radius:4px}

/* ---------- 通用 ---------- */
.container{width:min(1180px, calc(100% - 88px)); margin:0 auto}
.eyebrow{
  display:flex;align-items:center;gap:12px;
  font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--gold-2);opacity:.8}
.serif{font-family:var(--serif);font-weight:400}
.muted{color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:48px;padding:0 26px;border-radius:999px;
  background:var(--navy);color:#F7F1E2;
  font-size:14.5px;letter-spacing:.04em;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), background .3s;
  box-shadow:0 10px 24px -14px rgba(19,30,54,.7);
}
.btn:hover{transform:translateY(-2px);background:var(--navy-2);box-shadow:0 18px 34px -16px rgba(19,30,54,.6)}
.btn[disabled]{background:#E3DBCB;color:#9A927F;box-shadow:none;transform:none;cursor:not-allowed}
.btn[disabled]:hover{transform:none;background:#E3DBCB}
.btn--ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line-2)}
.btn--ghost:hover{background:rgba(23,28,38,.03);border-color:var(--gold-2);transform:translateY(-1px)}
.btn--sm{height:40px;padding:0 18px;font-size:13.5px}
.link-back{font-size:13.5px;color:var(--muted);letter-spacing:.04em;transition:color .3s}
.link-back:hover{color:var(--gold)}

/* =========================================================
   启动页
   ========================================================= */
.splash{
  position:fixed;inset:0;z-index:90;overflow:hidden;
  display:grid;place-items:center;
  background:
    radial-gradient(120% 90% at 50% 8%, #121E3C 0%, #0A1224 38%, #060A14 68%, #04060C 100%);
  color:var(--star);
  transition:opacity 1.1s var(--ease), transform 1.1s var(--ease);
}
.splash.is-out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash__sky{position:absolute;inset:-10%;pointer-events:none}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:twinkle var(--dur,4s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
@keyframes twinkle{0%,100%{opacity:.14}50%{opacity:.9}}

.splash__glow{
  position:absolute;left:50%;top:44%;width:900px;height:900px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(201,161,88,.18) 0%,rgba(201,161,88,.06) 32%,transparent 66%);
  filter:blur(10px);
  animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}

.splash__inner{position:relative;text-align:center;padding:0 24px}
.splash__mark{
  font-size:22px;color:var(--gold-2);opacity:0;
  transform:translateY(10px) scale(.8);
  transition:opacity 1.4s var(--ease), transform 1.4s var(--ease);
}
.splash__mark.in{opacity:1;transform:none}
.splash__name{
  margin:26px 0 0;font-family:var(--serif);font-weight:400;
  font-size:clamp(30px,3.8vw,46px);letter-spacing:.36em;text-indent:.36em;
  color:#FCF3DF;text-shadow:0 0 42px rgba(233,200,138,.28);
}
.splash__name .ch{display:inline-block;opacity:0;transform:translateY(22px);filter:blur(8px);
  transition:opacity 1.2s var(--ease), transform 1.2s var(--ease), filter 1.2s var(--ease)}
.splash__name .ch.in{opacity:1;transform:none;filter:none}

.splash__line{
  margin:0;font-size:clamp(13px,1.15vw,15.5px);letter-spacing:.28em;text-indent:.28em;
  color:rgba(244,233,210,.80);
}
#line1{margin-top:30px}
#line2{margin-top:14px}
.splash__line .ch{display:inline-block;opacity:0;transform:translateY(10px);
  transition:opacity 1s var(--ease), transform 1s var(--ease)}
.splash__line .ch.in{opacity:1;transform:none}

.splash__rule{width:0;height:1px;margin:36px auto 0;background:linear-gradient(90deg,transparent,rgba(201,161,88,.85),transparent);
  transition:width 1.6s var(--ease)}
.splash__rule.in{width:220px}

.splash__hint{
  margin-top:18px;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(244,233,210,.38);opacity:0;transition:opacity 1.2s var(--ease);
}
.splash__hint.in{opacity:1}
.splash__hint::after{content:"";animation:dots 2.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}

.splash__foot{
  position:absolute;left:34px;bottom:32px;font-size:10.5px;letter-spacing:.34em;
  color:rgba(244,233,210,.28);
}
.splash__skip{
  position:absolute;right:34px;bottom:30px;
  font-size:12px;letter-spacing:.24em;color:rgba(244,233,210,.42);
  padding:8px 14px;border:1px solid rgba(244,233,210,.14);border-radius:999px;
  transition:.4s var(--ease);
}
.splash__skip:hover{color:var(--star);border-color:rgba(244,233,210,.4);background:rgba(244,233,210,.05)}

/* =========================================================
   顶栏
   ========================================================= */
.app{opacity:0;transition:opacity 1s var(--ease)}
.app.in{opacity:1}

.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(250,247,240,.78);
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid rgba(23,28,38,.07);
}
.topbar__inner{
  width:min(1180px, calc(100% - 88px));margin:0 auto;height:76px;
  display:flex;align-items:center;gap:40px;
}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand__mark{color:var(--gold);font-size:15px;transform:translateY(-1px)}
.brand__name{font-family:var(--serif);font-size:19px;letter-spacing:.20em;color:var(--ink)}
.topnav{display:flex;gap:34px;margin-left:auto}
.topnav a{
  position:relative;font-size:14px;letter-spacing:.10em;color:var(--ink-2);
  padding:6px 0;transition:color .35s;
}
.topnav a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);
  transition:width .45s var(--ease);
}
.topnav a:hover{color:var(--ink)}
.topnav a:hover::after,.topnav a.is-active::after{width:100%}
.topnav a.is-active{color:var(--ink)}

.ability{
  display:flex;align-items:center;gap:10px;
  height:36px;padding:0 15px;border:1px solid var(--line-2);border-radius:999px;
  font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);
  background:rgba(255,255,255,.5);
}
.ability b{font-family:var(--serif);font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.02em}
.ability i{width:6px;height:6px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 0 3px rgba(201,161,88,.16)}

/* ---------- 视图切换 ---------- */
.view{min-height:calc(100vh - 76px)}
.view-enter{animation:viewIn .6s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* =========================================================
   首页
   ========================================================= */
.home{padding:56px 0 96px}
.hero__title{
  margin-top:22px;font-family:var(--serif);font-weight:400;
  font-size:clamp(30px,3.2vw,42px);line-height:1.34;letter-spacing:.03em;
}
.hero__title em{font-style:normal;color:var(--gold)}
.hero__sub{margin-top:16px;font-size:14.5px;color:var(--muted);letter-spacing:.03em}

/* 难度尺 */
.ruler-card{
  margin-top:44px;padding:30px 34px 26px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
}
.ruler-card__head{display:flex;align-items:baseline;justify-content:space-between;gap:20px}
.ruler-card__head h2{font-family:var(--serif);font-size:17px;letter-spacing:.10em;font-weight:400}
.ruler-card__head span{font-size:12px;color:var(--muted);letter-spacing:.04em}

.ruler{margin:34px 0 10px;position:relative;height:74px}
.ruler__track{
  position:absolute;left:0;right:0;top:38px;height:2px;
  background:linear-gradient(90deg,rgba(23,28,38,.10),rgba(23,28,38,.22),rgba(23,28,38,.10));
}
.ruler__band{position:absolute;top:30px;height:18px;border-radius:9px}
.ruler__band--ability{background:rgba(169,131,63,.13);border:1px solid rgba(169,131,63,.30);height:22px;top:28px;border-radius:11px}
.ruler__band--target{background:linear-gradient(90deg,rgba(169,131,63,.9),rgba(201,161,88,.9));height:8px;top:35px;border-radius:4px}
.ruler__marker{
  position:absolute;top:20px;width:1px;height:40px;background:var(--navy);
}
.ruler__marker::after{
  content:"";position:absolute;left:50%;top:-7px;transform:translateX(-50%);
  width:9px;height:9px;background:var(--navy);border-radius:50%;
}
.ruler__tick{position:absolute;top:46px;transform:translateX(-50%);font-size:11px;color:var(--muted);letter-spacing:.02em}
.ruler__tick::before{content:"";position:absolute;left:50%;top:-10px;width:1px;height:5px;background:rgba(23,28,38,.18)}
.ruler__legend{display:flex;gap:26px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ruler__legend span{display:inline-flex;align-items:center;gap:8px}
.ruler__legend i{width:14px;height:6px;border-radius:3px;display:inline-block}

/* 卡片网格 */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:64px 0 24px}
.section-head h2{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:.08em}
.section-head a{font-size:12.5px;color:var(--muted);letter-spacing:.10em;transition:color .3s}
.section-head a:hover{color:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.art-card{
  position:relative;display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-1);
  transition:transform .55s var(--ease), box-shadow .55s var(--ease), border-color .55s;
}
.art-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-2);border-color:rgba(169,131,63,.35)}
.art-card__cover{
  position:relative;height:166px;overflow:hidden;
  display:flex;align-items:flex-end;padding:16px 18px;
}
.art-card__cover::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 100% at 80% 0%,rgba(255,255,255,.18),transparent 55%);
}
.art-card__glyph{
  position:absolute;right:12px;bottom:-26px;
  font-family:var(--serif);font-size:132px;line-height:1;color:rgba(255,255,255,.14);
  user-select:none;
}
.art-card__lx{
  position:relative;z-index:1;
  font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.92);
  padding:5px 10px;border:1px solid rgba(255,255,255,.28);border-radius:6px;
  backdrop-filter:blur(4px);
}
.art-card__body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.art-card__body h3{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.04em;line-height:1.4}
.art-card__meta{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.art-card__reason{
  margin-top:6px;font-size:13px;color:var(--gold);letter-spacing:.02em;line-height:1.6;
}
.art-card__cta{
  margin-top:auto;padding-top:14px;font-size:12.5px;letter-spacing:.12em;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;transition:gap .4s var(--ease), color .4s;
}
.art-card:hover .art-card__cta{gap:14px;color:var(--gold)}

.cover-tech{background:linear-gradient(140deg,#1B2A4A 0%,#2C4A6E 55%,#3E6B7A 100%)}
.cover-nature{background:linear-gradient(140deg,#26402F 0%,#3C5B3E 55%,#6E7F4B 100%)}
.cover-history{background:linear-gradient(140deg,#3A2A1E 0%,#5C4028 55%,#8A6A3C 100%)}

/* 星河入口条 */
.galaxy-strip{
  margin-top:56px;display:flex;align-items:center;justify-content:space-between;gap:32px;
  padding:26px 32px;border-radius:var(--r-lg);
  background:linear-gradient(120deg,#0C1426 0%,#152140 60%,#1B2A4A 100%);
  color:var(--star);position:relative;overflow:hidden;
}
.galaxy-strip::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(60% 120% at 85% 20%,rgba(201,161,88,.22),transparent 60%);
}
.galaxy-strip__text{position:relative}
.galaxy-strip h3{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:.10em}
.galaxy-strip p{margin-top:8px;font-size:13px;color:rgba(244,233,210,.62);letter-spacing:.04em}
.galaxy-strip .btn{position:relative;background:rgba(244,233,210,.10);border:1px solid rgba(244,233,210,.24);color:var(--star);box-shadow:none}
.galaxy-strip .btn:hover{background:rgba(244,233,210,.18)}

/* =========================================================
   阅读页
   ========================================================= */
.reading-wrap{padding:48px 0 120px}
.reading{width:min(660px,100%);margin:0 auto}
.reading__head{display:flex;align-items:center;justify-content:space-between;gap:20px}
.reading__meta{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.reading__title{
  margin-top:34px;font-family:var(--serif);font-size:clamp(30px,3vw,40px);
  font-weight:400;letter-spacing:.04em;line-height:1.3;
}
.reading__sub{margin-top:12px;font-family:Georgia,var(--serif);font-size:14px;color:var(--muted);letter-spacing:.02em}
.reading__rule{height:1px;margin:32px 0 36px;background:linear-gradient(90deg,var(--gold-2),rgba(201,161,88,0) 70%)}
.reading__body p{
  font-family:Georgia,var(--serif);font-size:17.5px;line-height:1.98;color:#1F242E;
  margin-bottom:24px;letter-spacing:.004em;
}
.reading__body p:first-of-type::first-letter{
  float:left;font-size:62px;line-height:.82;padding:8px 14px 0 0;
  color:var(--gold);font-family:Georgia,serif;
}
.w{
  position:relative;display:inline;padding:1px 1px 2px;margin:0;border:0;background:none;
  font:inherit;color:inherit;cursor:pointer;border-bottom:1px dashed rgba(169,131,63,.55);
  transition:background .3s,color .3s,border-color .3s;
}
.w:hover{background:rgba(201,161,88,.14);border-bottom-color:var(--gold)}
.w.is-looked{color:#4E7A63;border-bottom:1px solid rgba(78,122,99,.35)}
.reading__foot{
  position:sticky;bottom:0;margin-top:48px;padding:20px 0 24px;
  background:linear-gradient(to top,var(--paper) 62%,rgba(250,247,240,0));
  display:flex;align-items:center;gap:24px;
}
.progress{flex:1;height:2px;background:rgba(23,28,38,.10);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .3s linear}

/* 词卡抽屉 */
.wordcard{
  position:fixed;top:96px;right:32px;width:330px;z-index:50;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);padding:26px 26px 24px;
  opacity:0;transform:translateX(22px) scale(.98);pointer-events:none;
  transition:opacity .45s var(--ease), transform .45s var(--ease);
}
.wordcard.is-open{opacity:1;transform:none;pointer-events:auto}
.wordcard__word{font-family:Georgia,var(--serif);font-size:30px;letter-spacing:.02em}
.wordcard__ph{margin-top:6px;font-size:13px;color:var(--muted);font-family:Georgia,serif}
.wordcard__divider{height:1px;margin:18px 0;background:var(--line)}
.wordcard__pos{font-size:11px;letter-spacing:.14em;color:var(--gold)}
.wordcard__mean{margin-top:8px;font-size:16.5px;line-height:1.6}
.wordcard__ctx{margin-top:14px;padding:12px 14px;background:var(--paper-2);border-radius:10px;
  font-family:Georgia,serif;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.wordcard__note b{flex:none}
.wordcard__note{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.wordcard__note b{color:var(--gold);font-weight:400}
.wordcard__foot{margin-top:20px;display:flex;gap:10px}

/* =========================================================
   答题页
   ========================================================= */
.quiz-wrap{padding:56px 0 120px;display:flex;justify-content:center}
.quiz{width:min(720px,100%)}
.quiz__head{display:flex;align-items:center;gap:20px}
.quiz__step{font-size:12px;letter-spacing:.18em;color:var(--muted)}
.dots{display:flex;gap:8px;margin-left:auto}
.dots i{width:22px;height:3px;border-radius:2px;background:rgba(23,28,38,.12);transition:background .4s}
.dots i.on{background:var(--gold)}
.dots i.done{background:rgba(169,131,63,.4)}
.quiz__type{margin-top:44px;font-size:11px;letter-spacing:.22em;color:var(--gold)}
.quiz__q{margin-top:14px;font-family:var(--serif);font-size:clamp(21px,2.2vw,26px);line-height:1.6;font-weight:400}
.options{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.option{
  width:100%;text-align:left;padding:17px 22px;border:1px solid var(--line);border-radius:14px;
  background:#fff;font-size:15px;line-height:1.6;color:var(--ink-2);
  display:flex;gap:16px;align-items:flex-start;
  transition:border-color .35s, background .35s, transform .35s var(--ease);
}
.option:hover{border-color:rgba(169,131,63,.45);transform:translateX(3px)}
.option b{font-family:Georgia,serif;font-size:13px;color:var(--muted);font-weight:400;padding-top:2px}
.option.is-picked{border-color:var(--gold);background:rgba(201,161,88,.08)}
.option.is-picked b{color:var(--gold)}
.quiz__foot{margin-top:38px;display:flex;justify-content:space-between;align-items:center}

/* =========================================================
   结果页
   ========================================================= */
.result-wrap{padding:48px 0 120px}
.result{width:min(880px,100%);margin:0 auto}
.result__hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  background:linear-gradient(135deg,#0E1830 0%,#16233F 52%,#1E2C4C 100%);
  color:var(--star);padding:42px 46px;
  display:flex;align-items:center;gap:56px;
}
.result__hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(2px 2px at 18% 30%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1.6px 1.6px at 72% 22%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.4px 1.4px at 85% 68%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1.8px 1.8px at 40% 78%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(70% 120% at 88% 10%,rgba(201,161,88,.20),transparent 60%);
}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
#ringArc{transition:stroke-dashoffset 1.3s cubic-bezier(.22,.72,.18,1)}
.ring__num{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
}
.ring__num b{font-family:Georgia,serif;font-size:40px;font-weight:400;letter-spacing:.02em;line-height:1}
.ring__num span{display:block;margin-top:6px;font-size:11px;letter-spacing:.20em;color:rgba(244,233,210,.55)}

.result__facts{position:relative}
.result__label{font-size:11px;letter-spacing:.24em;color:rgba(244,233,210,.55)}
.result__delta{margin-top:10px;display:flex;align-items:baseline;gap:8px}
.result__delta b{font-family:Georgia,serif;font-size:56px;font-weight:400;color:var(--gold-3);letter-spacing:.01em;line-height:1}
.result__delta span{font-size:13px;letter-spacing:.16em;color:rgba(244,233,210,.7)}
.result__range{margin-top:14px;font-size:14px;letter-spacing:.06em;color:rgba(244,233,210,.85)}
.result__range i{font-style:normal;color:rgba(244,233,210,.4);padding:0 8px}
.result__note{margin-top:10px;font-size:12.5px;color:rgba(244,233,210,.5)}

.result__stars{
  margin-top:22px;padding:26px 30px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:#fff;display:flex;align-items:center;gap:22px;box-shadow:var(--shadow-1);
}
.result__stars .ignite{
  font-size:22px;color:var(--gold-3);opacity:0;transform:scale(.4);
  transition:opacity .6s var(--ease), transform .8s cubic-bezier(.18,1.6,.4,1), color .6s;
  text-shadow:0 0 0 rgba(201,161,88,0);
}
.result__stars .ignite.on{opacity:1;transform:scale(1);color:var(--gold);text-shadow:0 0 18px rgba(201,161,88,.55)}
.result__stars p{font-size:13.5px;color:var(--ink-2);letter-spacing:.03em}
.result__stars p b{font-family:Georgia,serif;font-size:17px;color:var(--gold);font-weight:400}

.result__cards{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 30px;box-shadow:var(--shadow-1)}
.panel h3{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:.10em}
.tag{
  display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;
  font-size:12px;letter-spacing:.04em;background:rgba(178,74,58,.10);color:#A2453A;
}
.tag--gold{background:rgba(201,161,88,.14);color:var(--gold)}
.evidence{
  margin-top:16px;padding:16px 18px;background:var(--paper-2);border-radius:12px;
  font-family:Georgia,serif;font-size:13.5px;line-height:1.75;color:var(--ink-2);
}
.evidence mark{background:rgba(201,161,88,.30);color:inherit;padding:0 2px;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{
  display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line-2);font-size:13px;font-family:Georgia,var(--serif);
  transition:.35s var(--ease);
}
.chip:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}

.next-card{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:26px 30px;border-radius:var(--r-lg);background:var(--paper-2);border:1px solid var(--line)}
.next-card h3{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.04em}
.next-card p{margin-top:8px;font-size:12.5px;color:var(--muted);letter-spacing:.04em}

/* =========================================================
   星河
   ========================================================= */
.galaxy-page{position:relative;height:calc(100vh - 76px);min-height:620px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 10%,#111D38 0%,#0A1224 42%,#05080F 100%)}
#galaxyCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.galaxy__hud{position:absolute;left:56px;top:44px;color:var(--star);pointer-events:none}
.galaxy__hud .eyebrow{color:rgba(244,233,210,.45)}
.galaxy__hud .eyebrow::before{background:rgba(201,161,88,.8)}
.galaxy__hud h1{margin-top:18px;font-family:var(--serif);font-size:clamp(26px,2.6vw,34px);
  font-weight:400;letter-spacing:.16em;color:#F7EDD8}
.galaxy__hud p{margin-top:12px;font-size:13px;letter-spacing:.06em;color:rgba(244,233,210,.55)}
.galaxy__hud p b{font-family:Georgia,serif;font-size:16px;color:var(--gold-3);font-weight:400;padding:0 3px}

.galaxy__panel{
  position:absolute;right:44px;top:44px;width:290px;padding:24px 24px 20px;
  background:rgba(12,18,34,.62);border:1px solid rgba(244,233,210,.12);border-radius:var(--r-lg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--star);
}
.galaxy__panel h2{font-family:var(--serif);font-size:14px;font-weight:400;letter-spacing:.16em;color:rgba(244,233,210,.7)}
.stat{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px}
.stat span{font-size:12px;color:rgba(244,233,210,.5);letter-spacing:.06em}
.stat b{font-family:Georgia,serif;font-size:22px;font-weight:400;color:#F7EDD8}
.stat b em{font-family:var(--sans);font-style:normal;font-size:11px;color:rgba(244,233,210,.45);padding-left:4px}
.stat-line{height:1px;background:rgba(244,233,210,.10);margin-top:16px}

.legend{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.legend div{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(244,233,210,.6)}
.legend i{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}

.galaxy__hint{position:absolute;left:56px;bottom:40px;font-size:11.5px;letter-spacing:.20em;color:rgba(244,233,210,.35)}

.tip{
  position:fixed;z-index:60;pointer-events:none;padding:10px 14px;border-radius:10px;
  background:rgba(8,12,22,.92);border:1px solid rgba(244,233,210,.16);
  color:var(--star);font-size:12px;letter-spacing:.04em;line-height:1.6;white-space:nowrap;
  opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;
}
.tip.on{opacity:1;transform:none}
.tip b{font-family:Georgia,serif;font-weight:400;font-size:14px;color:var(--gold-3)}

/* =========================================================
   词汇本 / 我的
   ========================================================= */
.page{padding:56px 0 110px}
.page-head h1{font-family:var(--serif);font-size:clamp(28px,3vw,38px);font-weight:400;letter-spacing:.08em}
.page-head p{margin-top:14px;font-size:14px;color:var(--muted);letter-spacing:.03em}
.filters{display:flex;gap:10px;margin:32px 0 26px}
.filter{
  height:36px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  font-size:13px;color:var(--ink-2);letter-spacing:.04em;transition:.35s var(--ease);
}
.filter:hover{border-color:var(--gold-2)}
.filter.is-on{background:var(--navy);color:#F7F1E2;border-color:var(--navy)}

.word-row{
  display:grid;grid-template-columns:180px 1fr 110px;gap:24px;align-items:center;
  padding:20px 4px;border-bottom:1px solid var(--line);
}
.word-row__w{font-family:Georgia,serif;font-size:20px}
.word-row__s{font-size:13.5px;color:var(--muted);font-family:Georgia,serif;line-height:1.6}
.word-row__st{font-size:12px;letter-spacing:.06em;text-align:right}
.st-new{color:#A2453A}.st-fuzzy{color:var(--gold)}.st-known{color:#4E7A63}
.mastery{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.mastery i{width:5px;height:5px;border-radius:50%;background:rgba(23,28,38,.14)}
.mastery i.on{background:var(--gold)}

.me-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;margin-top:36px}
.profile{display:flex;align-items:center;gap:20px}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,#1B2A4A,#3E5B7A);color:var(--star);font-family:var(--serif);font-size:24px}
.profile h3{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:.06em}
.profile p{margin-top:6px;font-size:12.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv span{color:var(--muted)}
.note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8}

.tabbar{display:none}

/* =========================================================
   响应式
   ========================================================= */
@media (max-width:1080px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .result__cards{grid-template-columns:1fr}
  .me-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .container,.topbar__inner{width:calc(100% - 40px)}
  .topnav{display:none}
  .topbar__inner{height:64px;gap:16px}

  .ability .conf{display:none}
  .view{min-height:calc(100vh - 64px);padding-bottom:78px}
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;
    background:rgba(250,247,240,.92);backdrop-filter:blur(18px);
    border-top:1px solid rgba(23,28,38,.08);padding:8px 0 max(8px,env(safe-area-inset-bottom));
  }
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);letter-spacing:.06em}

  .tabbar a.is-active{color:var(--gold)}
  .home{padding-top:36px}
  .grid{grid-template-columns:1fr}
  .ruler-card{padding:22px 20px}
  .reading__body p{font-size:16.5px;line-height:1.9}
  .wordcard{left:16px;right:16px;width:auto;top:auto;bottom:84px}
  .result__hero{flex-direction:column;text-align:center;gap:26px;padding:34px 24px}
  .result__facts{text-align:center}
  .result__delta{justify-content:center}
  .galaxy__hud{left:24px;top:26px}
  .galaxy__panel{display:none}
  .galaxy__hint{display:none}
  .galaxy-page{height:calc(100vh - 64px - 78px);min-height:520px}
  .word-row{grid-template-columns:1fr auto;gap:8px}
  .word-row__s{grid-column:1/-1}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* =========================================================
   抽屉 / 轻提示 / 复习 / 新版三页（v11）
   ========================================================= */
.sheet-mask{position:fixed;inset:0;background:rgba(12,16,24,.36);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.4s var(--ease);z-index:80}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:94vw;background:#fff;z-index:81;transform:translateX(104%);transition:transform .5s var(--ease);padding:46px 36px 36px;overflow:auto;box-shadow:-40px 0 80px -50px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet__close{position:absolute;top:16px;right:18px;width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--muted);line-height:1}
.sheet__close:hover{background:rgba(23,28,38,.05);color:var(--ink)}
.sheet__label{font-size:11px;letter-spacing:.2em;color:var(--gold)}
.sheet__word{margin-top:10px;font-family:Georgia,var(--serif);font-size:38px;font-weight:400;letter-spacing:.01em;line-height:1.15}
.sheet__ph{margin-top:6px;font-family:Georgia,serif;font-size:13px;color:var(--muted)}
.sheet__mean{margin-top:18px;font-size:17px;line-height:1.65}
.sheet__quote{margin-top:16px;padding:14px 16px;background:var(--paper-2);border-radius:10px;font-family:Georgia,serif;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.sheet__note{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.75}
.sheet__mastery{display:flex;align-items:center;gap:10px;margin-top:24px;font-size:12px;color:var(--muted)}
.sheet__mastery b{font-family:Georgia,serif;font-weight:400;color:var(--gold);font-size:14px}
.sheet__from{margin-top:20px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.sheet__from a{color:var(--gold)}
.sheet__actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:rgba(19,30,54,.94);color:#F7F1E2;font-size:13px;letter-spacing:.04em;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.4s var(--ease);z-index:95;box-shadow:0 18px 40px -20px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.review{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 90% at 50% 0%,#121E3C,#070B16 60%);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s var(--ease)}
.review.on{opacity:1;pointer-events:auto}
.review__bar{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(244,233,210,.12)}
.review__bar i{display:block;height:100%;background:var(--gold-2);transition:width .4s}
.review__card{text-align:center;color:var(--star);padding:40px 24px}
.review__count{font-size:11px;letter-spacing:.24em;color:rgba(244,233,210,.45)}
.review__word{margin-top:22px;font-family:Georgia,var(--serif);font-size:62px;font-weight:400;letter-spacing:.02em;color:#FCF3DF}
.review__mean{margin-top:14px;font-size:16px;color:rgba(244,233,210,.72)}
.review__meta{margin-top:16px;font-size:12px;color:rgba(244,233,210,.45)}
.review__actions{margin-top:44px;display:flex;gap:14px;justify-content:center}
.review__actions .btn{background:rgba(244,233,210,.12);border:1px solid rgba(244,233,210,.25);color:var(--star);box-shadow:none}
.review__actions .btn:hover{background:rgba(244,233,210,.2)}
.review__actions .btn--ghost{background:transparent}
.review__done h2{margin-top:18px;font-family:var(--serif);font-size:28px;font-weight:400}
.review__sum{margin-top:14px;font-size:14px;color:rgba(244,233,210,.65)}
.review__sum b{color:var(--gold-3);font-family:Georgia,serif;font-weight:400;font-size:18px}

.galaxy__filters{display:flex;gap:8px;margin-top:24px;pointer-events:auto}
.gfilter{height:32px;padding:0 15px;border-radius:999px;border:1px solid rgba(244,233,210,.18);color:rgba(244,233,210,.62);font-size:12px;letter-spacing:.06em;transition:.3s var(--ease)}
.gfilter:hover{border-color:rgba(244,233,210,.42);color:var(--star)}
.gfilter.is-on{background:rgba(244,233,210,.13);border-color:rgba(244,233,210,.48);color:#F7EDD8}
.panel-label{margin-top:20px;font-size:10.5px;letter-spacing:.20em;color:rgba(244,233,210,.38)}
.bar-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11.5px;color:rgba(244,233,210,.55)}
.bar-row>span{width:26px;flex:none}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(244,233,210,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .9s var(--ease)}
.bar-row b{font-family:Georgia,serif;font-weight:400;font-size:11.5px;color:rgba(244,233,210,.72);width:34px;text-align:right;flex:none}
.panel-btn{margin-top:22px;width:100%;background:rgba(244,233,210,.10);border:1px solid rgba(244,233,210,.22);color:var(--star);box-shadow:none}
.panel-btn:hover{background:rgba(244,233,210,.18)}

.word-toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:30px 0 6px;flex-wrap:wrap}
.word-toolbar .filters{margin:0}
.toolbar-right{display:flex;align-items:center;gap:10px}
.search{height:36px;width:180px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:13px;background:#fff;outline:none;transition:.3s}
.search:focus{border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(201,161,88,.12)}
.sortsel{height:36px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:12.5px;color:var(--ink-2);padding:0 12px;outline:none}
.word-row{cursor:pointer;border-radius:10px;transition:background .3s}
.word-row:hover{background:rgba(201,161,88,.06);transform:translateX(4px)}
.word-row{transition:background .3s,transform .35s var(--ease)}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}

.me-hero{display:flex;align-items:center;gap:22px;margin-top:10px}
.me-hero h1{margin:0;font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:.06em}

.me-badge{display:inline-block;margin-top:12px;font-size:11.5px;letter-spacing:.06em;color:var(--gold);border:1px solid rgba(169,131,63,.3);padding:5px 12px;border-radius:999px}
.avatar{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#1B2A4A,#3E5B7A);color:var(--star);font-family:var(--serif);font-size:22px;letter-spacing:.08em}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow-1)}
.stat-card b{display:block;font-family:Georgia,serif;font-size:30px;font-weight:400;letter-spacing:.01em}
.stat-card span{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline}
.panel-head span{font-size:12px;color:var(--muted)}
.me-trend{margin-top:22px}
.spark{width:100%;height:64px;margin-top:18px;display:block}
.trend-note{margin-top:6px;font-size:12.5px;color:var(--muted)}
.trend-note b{font-family:Georgia,serif;color:var(--gold);font-weight:400}
.me-settings{margin-top:22px}

        speed: 0.5 + Math.random() * 1.0,
        appear: reduce ? 0 : 0.35 + i * 0.028,
        bornAt: -99,
        x: 0, y: 0, ang: 0
      }));
      this.lx = 688;
      this.hover = null;
      this.pointer = { x: -1, y: -1, active: false };
      this.layout();
      this.bind();
      this.start = performance.now();
      this.frameCount = 0;
      const qp = new URLSearchParams(location.search).get("t");
      this.frozen = qp ? parseFloat(qp) : null;
      requestAnimationFrame((t) => this.frame(t));
      // 兜底：若浏览器未驱动动画（如无头截图），直接画一帧稳定状态
      setTimeout(() => { if (this.frameCount < 3) this.draw(6); }, 400);
    }

    layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = this.canvas.getBoundingClientRect();
      this.w = rect.width || 800;
      this.h = rect.height || 600;
      this.canvas.width = Math.round(this.w * dpr);
      this.canvas.height = Math.round(this.h * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const cx = (this.cx = this.w * 0.455);
      const cy = (this.cy = this.h * 0.52);
      this.coreR = Math.max(44, Math.min(this.w, this.h) * 0.074);

      const radius = Math.min(this.w, this.h) * 0.335;
      this.clusters = {};
      const names = Object.keys(this.topics);

      names.forEach((name, idx) => {
        const list = this.stars.filter((s) => s.topic === name);
        const base = -Math.PI / 2 + (idx * Math.PI * 2) / names.length;
        const spread = 0.46;
        list.forEach((s, i) => {
          const ang = base + (i / Math.max(1, list.length - 1) - 0.5) * spread + (Math.random() - 0.5) * 0.14;
          const dist = this.coreR * 1.85 + (1 - s.p) * radius * 0.72 + 12;
          s.ang = ang;
          s.x = cx + Math.cos(ang) * dist;
          s.y = cy + Math.sin(ang) * dist;
        });
        this.clusters[name] = {
          x: cx + Math.cos(base) * radius * 1.02,

      });

      // 待点亮的星座（虚位）：题材少于 5 个时才画，避免和星座挤在一起

      if (false) {

      this.ghost = Array.from({ length: 7 }, (_, i) => {
        const ang = ghostBase + (i / 6 - 0.5) * 0.72;
        const dist = this.coreR * 2.35 + 70 + Math.random() * 40;
        return { x: cx + Math.cos(ang) * dist, y: cy + Math.sin(ang) * dist };
      });

      }
      this.lines = Object.keys(this.topics).map((name) => ({
        color: this.topics[name].color,
        pts: this.stars.filter((s) => s.topic === name).sort((a, b) => a.ang - b.ang)
      }));
    }

    bind() {
      const move = (e) => {
        const r = this.canvas.getBoundingClientRect();
        this.pointer.x = e.clientX - r.left;
        this.pointer.y = e.clientY - r.top;
        this.pointer.active = true;
        this.pick();
      };
      this.canvas.addEventListener("mousemove", move);
      this.canvas.addEventListener("mouseleave", () => {
        this.pointer.active = false;
        this.hover = null;
        this.canvas.style.cursor = "default";
        if (this.onHover) this.onHover(null, 0, 0);
      });
      this.canvas.addEventListener("click", () => {
        if (this.hover && this.onClick) this.onClick(this.hover);
      });
      let t;
      window.addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(() => this.layout(), 150);
      });
    }

    pick() {
      const { x: px, y: py } = this.pointer;
      let best = null;
      let bestD = 20;
      for (const s of this.stars) {
        const d = Math.hypot(s.x - px, s.y - py);
        if (d < bestD) { best = s; bestD = d; }
      }
      if (best !== this.hover) {
        this.hover = best;
        this.canvas.style.cursor = best ? "pointer" : "default";
        if (this.onHover) this.onHover(best, px, py);
      }
    }

    frame(now) {
      this.frameCount++;
      const t = this.frozen != null ? this.frozen : (now - this.start) / 1000;
      this.draw(t);
      requestAnimationFrame((n) => this.frame(n));
    }

    draw(t) {
      const { ctx, w, h, cx, cy } = this;
      const dimOf = (topic) => (this.filter && this.filter !== "all" && topic !== this.filter ? 0.12 : 1);
      ctx.clearRect(0, 0, w, h);

      const ox = this.pointer.active ? (this.pointer.x / w - 0.5) * 16 : 0;
      const oy = this.pointer.active ? (this.pointer.y / h - 0.5) * 16 : 0;

      // 远景星尘
      for (let i = 0; i < 170; i++) {
        const x = (i * 97.13) % w;
        const y = (i * 61.7) % h;
        const a = 0.05 + 0.14 * Math.abs(Math.sin(t * 0.4 + i * 0.7));
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(x + ox * 0.5, y + oy * 0.5, 1, 1);

      // 星云
      Object.keys(this.clusters).forEach((key) => {
        const c = this.clusters[key];
        const dim = dimOf(key);
        const g = ctx.createRadialGradient(c.x + ox, c.y + oy, 0, c.x + ox, c.y + oy, 200);
        g.addColorStop(0, rgba(c.color, 0.15 * dim));
        g.addColorStop(0.5, rgba(c.color, 0.05 * dim));
        g.addColorStop(1, rgba(c.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x + ox, c.y + oy, 200, 0, Math.PI * 2);
        ctx.fill();
      });

      // 核心
      const pulse = 1 + Math.sin(t * 1.1) * 0.025;
      const cg = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, this.coreR * 2.6);
      cg.addColorStop(0, "rgba(252,246,232,0.98)");
      cg.addColorStop(0.12, "rgba(233,200,138,0.72)");
      cg.addColorStop(0.45, "rgba(201,161,88,0.16)");
      cg.addColorStop(1, "rgba(201,161,88,0)");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(cx + ox, cy + oy, this.coreR * 2.6 * pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(244,233,210,0.16)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx + ox, cy + oy, this.coreR * 1.5, 0, Math.PI * 2);
      ctx.stroke();

      // 能力轨道
      ctx.save();
      ctx.setLineDash([2, 9]);
      ctx.strokeStyle = "rgba(244,233,210,0.11)";
      [2.35, 3.2].forEach((m) => {
        ctx.beginPath();
        ctx.arc(cx + ox, cy + oy, this.coreR * m, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.restore();

      // 星座连线
      ctx.lineWidth = 1;
      this.lines.forEach((line) => {
        for (let i = 0; i < line.pts.length - 1; i++) {
          const a = line.pts[i], b = line.pts[i + 1];
          const grow = Math.min(1, Math.max(0, (t - a.appear) / 1.1));
          if (grow <= 0) continue;
          ctx.strokeStyle = rgba(line.color, 0.13 * grow * dimOf(a.topic));
          ctx.beginPath();
          ctx.moveTo(a.x + ox, a.y + oy);
          ctx.lineTo(a.x + ox + (b.x - a.x) * grow, a.y + oy + (b.y - a.y) * grow);
          ctx.stroke();
        }
      });

      // 虚位星座
      if (this.ghost) {
        ctx.save();
        ctx.setLineDash([3, 7]);
        ctx.strokeStyle = "rgba(244,233,210,0.10)";
        ctx.beginPath();
        this.ghost.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x + ox, p.y + oy);
          else ctx.lineTo(p.x + ox, p.y + oy);
        });
        ctx.stroke();
        ctx.setLineDash([]);
        this.ghost.forEach((p) => {
          ctx.strokeStyle = "rgba(244,233,210,0.22)";
          ctx.beginPath();
          ctx.arc(p.x + ox, p.y + oy, 3.2, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.restore();
        if (this.w > 760) {
        ctx.fillStyle = "rgba(244,233,210,0.40)";
        ctx.font = '400 12px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = "center";
        const gx = this.ghost[3].x + ox;
        const gy = this.ghost[3].y + oy - 26;
        ctx.fillText("下一个星座 · 还差 4 颗", gx, gy);
        }
      }

      // 星星
      this.stars.forEach((s) => {
        const age = t - s.appear;
        if (age < 0) return;
        const k = Math.min(1, Math.max(0, age / 0.9));
        const tw = 0.55 + 0.45 * Math.sin(t * s.speed + s.phase);
        const isHover = this.hover === s;
        const x = s.x + ox;
        const y = s.y + oy;
        const color = this.topics[s.topic].color;
        const dim = dimOf(s.topic);
        const size = (s.size + (isHover ? 1.8 : 0)) * k;
        const glowR = size * 13;

        const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
        g.addColorStop(0, rgba(color, 0.62 * tw * k * dim));
        g.addColorStop(0.25, rgba(color, 0.26 * tw * k * dim));
        g.addColorStop(1, rgba(color, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, glowR, 0, Math.PI * 2);
        ctx.fill();

        // 星芒：掌握越牢，芒越长
        if (s.p > 0.62 || isHover) {
          const len = size * (4.2 + s.p * 5);
          ctx.strokeStyle = rgba(color, 0.30 * tw * k * dim);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x - len, y); ctx.lineTo(x + len, y);
          ctx.moveTo(x, y - len); ctx.lineTo(x, y + len);
          ctx.stroke();
        }

        ctx.fillStyle = `rgba(255,252,244,${(0.78 + 0.22 * tw) * k * (0.25 + 0.75 * dim)})`;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.6, size), 0, Math.PI * 2);
        ctx.fill();

        const since = t - s.bornAt;
        if (since > 0 && since < 2.4) {
          const q = since / 2.4;
          ctx.strokeStyle = rgba(color, 0.55 * (1 - q));
          ctx.beginPath();
          ctx.arc(x, y, size + q * 30, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      // 中心标签
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(247,237,216,0.92)";
      ctx.font = '400 21px Georgia, "Songti SC", serif';
      ctx.fillText("LX " + Math.round(this.lx), cx + ox, cy + oy + 1);
      ctx.fillStyle = "rgba(244,233,210,0.36)";
      ctx.font = '400 10px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText("当前能力", cx + ox, cy + oy + 21);
    }

    setLabel(lx) { this.lx = lx; }

    setFilter(t) { this.filter = t || "all"; }

    lightUp(word) {
      const s = this.stars.find((x) => x.word === word);
      if (!s) return;
      s.bornAt = (performance.now() - this.start) / 1000;
    }
  }

  window.GalaxyMap = GalaxyMap;
})();

          <div class="galaxy-strip__text">
            <h3>你已经点亮 ${total} 颗星</h3>
            <p>本周新增 ${USER.weekly} 颗 · 科技星座完成 68% · 去星河看看它们的位置</p>
          </div>
          <span class="btn btn--ghost">进入星河</span>
        </a>
      </div>
    </div>`;
  }

  function fmtDate() {
    const d = new Date();
    const w = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${w}`;
  }

  /* ==========================================================
   阅读 + 题目同页（v14）
   ========================================================== */
const HL_COLORS = ["#6FA8D6", "#7FB08A", "#C9A158", "#A98BB5", "#D08C6A", "#7FA8A0"];

function isCollected(w) { return !!state.collected[w]; }

function toggleCollected(w) {
  if (state.collected[w]) { delete state.collected[w]; return false; }
  state.collected[w] = 1;
  if (state.vocab[w]) state.vocab[w].p = Math.min(state.vocab[w].p, 0.4);
  return true;
}

const STOP = ("the a an of and to in is are was were it that this for on with as at by be been being from or but not " +
  "which who whom whose they their there these those he she we you i his her its our your my me him us them " +
  "has have had do does did can could will would should may might must about into over after before than then so if " +
  "when where why how all any both each more most other some such only own same too very just also up down out off").split(" ");

function lemmaKey(w) {
  const k = String(w).toLowerCase();
  const cands = [k, k.replace(/ies$/, "y"), k.replace(/es$/, ""), k.replace(/s$/, ""), k.replace(/ed$/, ""), k.replace(/ing$/, ""), k.replace(/ly$/, "")];
  for (let i = 0; i < cands.length; i++) if (WORDS[cands[i]]) return cands[i];
  return k;
}

function plainPara(p) {
  return p.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g, "$1");
}

function wordRanges(p) {
  const out = [];
  let plain = "", last = 0, m;
  const re = /\{([^}|]+)(?:\|([^}]+))?\}/g;
  while ((m = re.exec(p))) {
    plain += p.slice(last, m.index);
    const start = plain.length;
    plain += m[1];
    out.push({ start: start, end: plain.length, key: (m[2] || m[1]).toLowerCase() });
    last = re.lastIndex;
  }
  plain += p.slice(last);
  return { plain: plain, words: out };
}

function findPrefix(text, ev) {
  if (!ev) return null;
  const clean = ev.replace(/[…]/g, "").replace(/\.\.\.$/, "").trim();
  const T = text.toLowerCase();
  const words = clean.split(/\s+/);
  for (let n = words.length; n >= 3; n--) {
    let sub = words.slice(0, n).join(" ").replace(/[.,;:!?"')\]]+$/, "");
    if (sub.length < 12) continue;
    const i = T.indexOf(sub.toLowerCase());
    if (i >= 0) return [i, i + sub.length];
  }
  return null;
}

function locateMarks(a, paper) {
  const marks = [];
  paper.forEach(function (q, qi) {
    for (let pi = 0; pi < a.paras.length; pi++) {
      const hit = findPrefix(plainPara(a.paras[pi]), q.evidence);
      if (hit) { marks.push({ pi: pi, start: hit[0], end: hit[1], q: qi }); break; }
    }
  });
  return marks;
}

function articleHTML(a, marks, clickable, paper, answers) {
  return a.paras.map(function (para, pi) {
    const wr = wordRanges(para);
    const plain = wr.plain;
    if (!clickable) return "<p>" + plain + "</p>";

    const words = [];
    const re = /[A-Za-z][A-Za-z']*/g;
    let m;
    while ((m = re.exec(plain))) {
      if (STOP.indexOf(m[0].toLowerCase()) > -1) continue;
      words.push({ start: m.index, end: m.index + m[0].length, key: lemmaKey(m[0]) });
    }
    const here = marks.filter(function (x) { return x.pi === pi; });

    let html = "", i = 0;
    while (i < plain.length) {
      const word = words.filter(function (w) { return i >= w.start && i < w.end; })[0];
      const mark = here.filter(function (x) { return i >= x.start && i < x.end; })[0];
      const key = (mark ? "m" + mark.q : "") + "|" + (word ? "w" + word.key : "");
      let j = i + 1;
      while (j < plain.length) {
        const w2 = words.filter(function (w) { return j >= w.start && j < w.end; })[0];
        const m2 = here.filter(function (x) { return j >= x.start && j < x.end; })[0];
        if ((m2 ? "m" + m2.q : "") + "|" + (w2 ? "w" + w2.key : "") !== key) break;
        j++;
      }
      let out = plain.slice(i, j);
      if (word) out = '<button class="w" data-w="' + word.key + '" type="button">' + out + "</button>";
      if (mark) {
        const isEnd = j >= mark.end;
        out = '<mark class="hl' + (isEnd ? " hl-end" : "") + '" style="--hl:' + HL_COLORS[mark.q % HL_COLORS.length] + '" data-q="' + (mark.q + 1) + '">' + out + "</mark>";
      }
      html += out;
      i = j;
    }

    const notes = here.map(function (mk) {
      const q = paper[mk.q];
      const ok = answers && answers[mk.q] === q.answer;
      return '<div class="pnote" style="--hl:' + HL_COLORS[mk.q % HL_COLORS.length] + '">' +
        '<b>Q' + (mk.q + 1) + " · " + q.dim + " · " + q.skill + " · " + (ok ? "答对" : "答错") + "</b>" +
        '<span>' + q.explain + "</span>" +
        (ok ? "" : '<em>正确答案 ' + "ABCD"[q.answer] + "</em>") +
        "</div>";
    }).join("");

    return "<p>" + html + "</p>" + notes;
  }).join("");
}

function levelPlan() {
  const c = USER.c;
  if (c >= 850) return { words: 360, qn: 6, seg: "雅思", band: "850+" };
  if (c >= 650) return { words: 300, qn: 6, seg: "四六级", band: "650–850" };
  if (c >= 450) return { words: 220, qn: 5, seg: "中学", band: "450–650" };
  return { words: 170, qn: 4, seg: "KET", band: "450 以下" };
}

function buildVocabArticle() {
  const words = Object.keys(state.addedToday);
  if (words.length < 3) return null;
  const plan = levelPlan();
  const picked = shuffle(words.slice()).slice(0, plan.words > 280 ? 6 : 5);
  const paras = [];

  paras.push("This passage was written for one reader: you. It brings together " + picked.length + " words you collected recently \u2014 " + picked.join(", ") + " \u2014 and gives each of them a job to do. Read it once for the argument, then again for the words. The questions after it are chosen from the types you have missed before, so they may feel familiar in an uncomfortable way.");

  const tails = [
    "The word names something specific here, and the sentence would be poorer without it.",
    "Remove it and the meaning collapses into something vague.",
    "This is the kind of sentence an exam might borrow, because the word carries the whole idea.",
    "Read it aloud once; the stress falls on the word, which is a clue to its importance.",
    "A dictionary definition would be shorter, but the sentence tells you where the word belongs.",
    "The same word could appear in a news report or a lab notebook; here it has found a home."
  ];
  const learned = [
    "A word learned inside a situation comes back with the situation.",
    "Memory works this way: the scene returns first, the word follows.",
    "That is why reading beats reciting, at least for words like this one.",
    "The context does half the work of remembering.",
    "If you can rebuild the sentence, you can rebuild the word.",
    "This is also how exam writers test vocabulary: in context, not in isolation."
  ];
  picked.forEach(function (w, i) {
    const info = WORDS[w] || {};
    const ex = (info.ex || (w + " appeared in something you read this week.")).replace(/\.$/, ".");
    const marked = ex.replace(new RegExp("\\b(" + w + ")\\b", "i"), "{$1}");
    paras.push(marked + " " + tails[(i * 2 + 1) % tails.length] + " " + learned[i % learned.length]);
  });

  if (plan.words > 260) {
    paras.push("None of this means that lists are useless. A list is a map; a sentence is a road you have actually walked. The reader who has walked the road remembers the shape of the land, and the shape is what an exam asks about: not whether you have seen a word, but whether you can use it while something else is happening in the sentence.");
  }

  paras.push("Read the sentences again. Which one could you use in your own writing tomorrow? That question matters more than any score.");

  const qs = [];
  const add = function (q) { qs.push(q); };

  add({
    dim: "整合与解释", skill: "主旨",
    q: "What is the passage mainly about?",
    options: ["How coins were made in Rome.", "A set of new words used in real sentences.", "Why whales strand themselves.", "How to build a vertical forest."],
    answer: 1, evidence: paras[0], explain: "开篇就说明这篇是为读者本人写的，把最近收集的词放进句子里。"
  });

  add({
    dim: "定位与提取", skill: "细节",
    q: "According to the passage, what happens when a word is learned inside a situation?",
    options: ["It is forgotten faster.", "It becomes easier to recall.", "It loses its grammar.", "It can only be used in writing."],
    answer: 1, evidence: paras[1] || paras[0], explain: "文中说“A word learned inside a situation is easier to recall”。"
  });

  add({
    dim: "整合与解释", skill: "推断",
    q: "Why does the writer compare a list to a map?",
    options: ["To show lists are useless.", "To show lists help but are not enough.", "To explain how maps are printed.", "To prove memory is visual."],
    answer: 1, evidence: (paras[plan.words > 260 ? 7 : 6] || paras[paras.length - 2] || paras[0]), explain: "作者说“A list is a map; a sentence is a road”，意思是清单有用但不等于真正走过。"
  });

  add({
    dim: "评价与反思", skill: "作者态度",
    q: "What is the writer's attitude toward learning words in context?",
    options: ["Doubtful.", "Supportive.", "Indifferent.", "Openly hostile."],
    answer: 1, evidence: paras[paras.length - 1], explain: "结尾鼓励读者把词用进自己的写作，态度是支持的。"
  });

  picked.slice(0, 3).forEach(function (w) {
    const info = WORDS[w] || {};
    const others = shuffle(Object.keys(WORDS).filter(function (k) { return k !== w; })).slice(0, 3).map(function (k) { return WORDS[k].mean; });
    const opts = shuffle([info.mean].concat(others));
    add({
      dim: "整合与解释", skill: "词汇",
      q: "In the passage, \"" + w + "\" most nearly means",
      options: opts, answer: opts.indexOf(info.mean),
      evidence: info.ex || w,
      explain: w + " 的意思是「" + info.mean + "」。"
    });
  });

  const weak = weakSkills();
  const main = qs.filter(function (q) { return q.skill === "主旨"; });
  const rest = qs.filter(function (q) { return q.skill !== "主旨"; });
  rest.sort(function (A, B) {
    const wa = weak.indexOf(A.skill), wb = weak.indexOf(B.skill);
    if (wa !== wb) return (wa < 0 ? 99 : wa) - (wb < 0 ? 99 : wb);
    return 0;
  });
  const finalQs = main.concat(rest.slice(0, Math.max(0, plan.qn - 1)));

  const text = paras.join(" ");
  return {
    id: "gen1", topic: "education", title: "今天的生词小短文", en: "Words You Met Today",
    lx: USER.c, words: text.split(/\s+/).length, minutes: Math.max(2, Math.round(text.split(/\s+/).length / 70)),
    plan: plan, reason: "按 LX " + plan.band + " 生成",
    paras: paras, questions: finalQs
  };
}

function weakSkills() {
  return Object.keys(state.mistakeDims || {}).sort(function (a, b) { return state.mistakeDims[b] - state.mistakeDims[a]; });
}

function buildPaper(a, reshuffle) {
  const bank = (Q(a.id) || []).slice();
  const n = USER.h > 100 ? 4 : USER.h > 75 ? 5 : 6;
  const weak = weakSkills();
  let idx = bank.map(function (q, i) { return { q: q, i: i }; });
  if (reshuffle) idx = shuffle(idx);
  idx.sort(function (A, B) {
    const wa = weak.indexOf(A.q.skill), wb = weak.indexOf(B.q.skill);
    if (wa !== wb) return (wa < 0 ? 99 : wa) - (wb < 0 ? 99 : wb);
    return A.i - B.i;
  });
  const picked = idx.slice(0, n);
  const main = picked.filter(function (x) { return x.q.skill === "主旨"; });
  const rest = picked.filter(function (x) { return x.q.skill !== "主旨"; });
  rest.sort(function (A, B) {
    const wa = weak.indexOf(A.q.skill), wb = weak.indexOf(B.q.skill);
    return (wa < 0 ? 99 : wa) - (wb < 0 ? 99 : wb);
  });
  const ordered = main.concat(rest);
  state.paperFocus = [];
  ordered.forEach(function (x) {
    if (weak.indexOf(x.q.skill) > -1 && state.paperFocus.indexOf(x.q.skill) < 0) state.paperFocus.push(x.q.skill);
  });
  return ordered.map(function (x) { return x.q; });
}

function pushMistake(a, q, qi, picked) {
  const key = a.id + "#" + q.q;
  if (state.mistakes.some(function (m) { return m.key === key; })) return;
  state.mistakeDims[q.skill] = (state.mistakeDims[q.skill] || 0) + 1;
  state.mistakes.unshift({
    key: key, articleId: a.id, article: a.title, q: q, picked: picked,
    at: new Date().toISOString().slice(0, 10)
  });
  if (state.mistakes.length > 60) state.mistakes.pop();
}

function submitPaper() {
  const r = state.read;
  if (!r || r.submitted) return;
  if (Object.keys(r.answers).length < r.paper.length) { toast("还有 " + (r.paper.length - Object.keys(r.answers).length) + " 题没答"); return; }
  const a = byId(r.id);
  let ra = USER.c, correct = 0;
  const bySkill = {};
  r.paper.forEach(function (q, i) {
    const E = 0.25 + 0.75 / (1 + Math.exp(-(ra - (a.lx + (bias[q.skill] || 0))) / 174));
    const ok = r.answers[i] === q.answer;
    if (ok) correct++;
    else {
      pushMistake(a, q, i, r.answers[i]);
      bySkill[q.skill] = (bySkill[q.skill] || 0) + 1;
    }
    ra += 28 * ((ok ? 1 : 0) - E);
  });
  const delta = Math.round(ra - USER.c);
  USER.c = Math.round(ra);
  USER.n = (USER.n || 20) + r.paper.length;
  USER.h = Math.min(150, Math.max(40, Math.round(400 / Math.sqrt(USER.n))));
  USER.confidence = USER.h > 100 ? "低" : USER.h > 60 ? "中" : "高";
  USER.onboarded = true;
  USER.vocabEstimate = vocabFromLx(USER.c);
  const today = new Date().toDateString();
  if (state.lastDay !== today) { state.lastDay = today; USER.streak = Math.min(60, USER.streak + 1); }
  saveProfile();
  r.submitted = true;
  r.result = { correct: correct, total: r.paper.length, delta: delta, bySkill: bySkill };
  state.history.unshift({ id: a.id, correct: correct, total: r.paper.length, delta: delta, at: Date.now() });
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function viewRead(id) {
  const a = byId(id);
  if (!a) return '<div class="home"><div class="container"><p>没有找到这篇文章。</p></div></div>';
  if (!state.read || state.read.id !== id) {
    state.read = { id: id, answers: {}, submitted: false, paper: buildPaper(a) };
  }
  const drillNow = state.drill;
  const r = state.read;
  const marks = r.submitted ? locateMarks(a, r.paper) : [];
  const answered = Object.keys(r.answers).length;

  const qcards = r.paper.map(function (q, i) {
    const picked = r.answers[i];
    const ok = r.submitted && picked === q.answer;
    const opts = q.options.map(function (o, oi) {
      let cls = "qopt";
      if (r.submitted) {
        if (oi === q.answer) cls += " is-right";
        else if (oi === picked) cls += " is-wrong";
      } else if (oi === picked) cls += " is-picked";
      return '<button class="' + cls + '" data-opt="' + oi + '" data-q="' + i + '" type="button"><b>' + "ABCD"[oi] + "</b><span>" + o + "</span></button>";
    }).join("");
    const fb = r.submitted ? (
      '<div class="qfb">' +
        '<div class="qfb__row"><span class="tag ' + (ok ? "tag--ok" : "") + '">' + (ok ? "答对" : "答错") + " · " + q.dim + " · " + q.skill + "</span>" +
        (ok ? "" : '<span class="qfb__ans">正确答案 ' + "ABCD"[q.answer] + "</span>") + "</div>" +
        '<p class="qfb__exp">' + q.explain + "</p>" +
        '<div class="qfb__ev"><span class="dot" style="--hl:' + HL_COLORS[i % HL_COLORS.length] + '"></span>' + q.evidence + "</div>" +
      "</div>"
    ) : "";
    return '<div class="qcard ' + (r.submitted ? (ok ? "is-ok" : "is-no") : "") + '">' +
      '<div class="qcard__head"><span class="qnum">Q' + (i + 1) + "</span>" + (r.submitted ? '<span class="qdim">' + q.dim + " · " + q.skill + "</span>" : "") + "</div>" +
      '<p class="qstem">' + q.q + "</p>" +
      '<div class="qopts">' + opts + "</div>" + fb + "</div>";
  }).join("");

  const strip = r.submitted ? (
    '<div class="strip">' +
      "<div><b>" + Math.round((r.result.correct / r.result.total) * 100) + "%</b><span>" + r.result.correct + " / " + r.result.total + " 题</span></div>" +
      "<div><b>" + (r.result.delta >= 0 ? "+" : "") + r.result.delta + "</b><span>本次 LX</span></div>" +
      "<div><b>" + (USER.c - USER.h) + "–" + (USER.c + USER.h) + "</b><span>新区间</span></div>" +
      '<div class="strip__note">错因：' + (Object.keys(r.result.bySkill).length ? Object.keys(r.result.bySkill).map(function (k) { return k + "×" + r.result.bySkill[k]; }).join(" · ") : "无，全对") + "</div>" +
    "</div>"
  ) : "";

  return `
  <div class="reading-wrap">
    <div class="container">
      ${drillNow ? '<div class="drill-bar"><b>举一反三</b> 针对你容易错的「' + drillNow + '」选了这篇，答完记得看原文标注。</div>' : ""}
      ${strip}
      <div class="reading__head">
        <a class="link-back" href="#/home">← 返回首页</a>
        <span class="reading__meta">LX ${a.lx} · 约 ${a.words} 词 · ${a.minutes} 分钟</span>
      </div>
      <div class="read-grid">
        <article class="reading">
          <h1 class="reading__title">${a.title}</h1>
          <p class="reading__sub">${a.en}</p>
          <div class="reading__rule"></div>
          <p class="read-hint">${r.submitted ? "已交卷 · 点任意单词查词典，可加入生词本" : "答题时单词暂不可点，交卷后开启查词（避免影响判断）"}</p>
          <div class="reading__body ${r.submitted ? "is-open" : ""}" id="readingBody">${articleHTML(a, marks, r.submitted, r.paper, r.answers)}</div>
        </article>

        <aside class="paper">
          <div class="paper__head">
            <div>
              <p class="eyebrow">AI 生成 · 按你的水平</p>
              <h2>${r.submitted ? "本篇练习已提交" : "读完后作答"}</h2>
            </div>
            ${r.submitted ? "" : '<button class="btn btn--sm btn--ghost" id="regen" type="button">换一组</button>'}
          </div>
          <p class="paper__meta">${r.paper.length} 题 · 依据 LX ${a.lx} 与你的区间 ${USER.c - USER.h}–${USER.c + USER.h}${state.paperFocus && state.paperFocus.length ? " · 优先练 " + state.paperFocus.join(" / ") : ""} · <span id="answeredCount">已答 ${answered}/${r.paper.length}</span></p>
          ${qcards}
          ${r.submitted
            ? '<div class="paper__foot"><a class="btn" href="#/home">下一篇</a><a class="btn btn--ghost" href="#/mistakes">看错题本</a></div>'
            : '<div class="paper__foot"><button class="btn" id="submitPaper" type="button">交卷，看解析</button></div>'}
        </aside>
      </div>
    </div>
  </div>`;
}

function bindReading() {
  const body = $("#readingBody");
  const root = document.querySelector(".read-grid");
  if (!root) return;

  const card = () => {
    let el = document.getElementById("wordcard");
    if (!el) {
      el = document.createElement("aside");
      el.id = "wordcard";
      el.className = "wordcard";
      document.body.appendChild(el);
    }
    return el;
  };

  if (body) body.addEventListener("click", function (e) {
    const w = e.target.closest(".w");
    if (!w) return;
    openSheet(dictSheetHTML(w.dataset.w));
  });

  document.addEventListener("click", function (e) {
    const opt = e.target.closest(".qopt");
    if (!opt || !state.read || state.read.submitted) return;
    state.read.answers[+opt.dataset.q] = +opt.dataset.opt;
    const qs = opt.closest(".qopts");
    qs.querySelectorAll(".qopt").forEach(function (x) { x.classList.remove("is-picked"); });
    opt.classList.add("is-picked");
    const cnt = document.getElementById("answeredCount");
    if (cnt) cnt.textContent = "已答 " + Object.keys(state.read.answers).length + "/" + state.read.paper.length;
  }, true);

  document.addEventListener("click", function (e) {
    if (e.target.closest("#submitPaper")) { submitPaper(); return; }
    if (e.target.closest("#regen")) {
      const a = byId(state.read.id);
      state.read = { id: a.id, answers: {}, submitted: false, paper: buildPaper(a, true) };
      render();
    }
  });
}

function dictSheetHTML(w) {
  const info = WORDS[w] || {};
  const known = !!WORDS[w];
  const topic = info.topic || "tech";
  const p = state.vocab[w] ? state.vocab[w].p : 0.5;
  const on = isCollected(w);
  return '' +
    '<div class="dict__img" style="color:' + TOPICS[topic].color + '"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (IMG[info.img] || IMG.books) + "</svg></div>" +
    '<p class="sheet__label">' + (known ? TOPICS[topic].name : "词典未收录") + (p < 0.3 ? " · 未知" : p < 0.6 ? " · 模糊" : " · 已掌握") + "</p>" +
    '<h2 class="sheet__word">' + w + "</h2>" +
    (known

        '<div class="dict__def"><span class="dict__pos">' + (info.pos || "") + "</span><p>" + (info.mean || "") + "</p></div>" +
        (info.ex ? '<div class="dict__ex"><p class="en">' + info.ex + '</p><p class="zh">' + (info.exZh || "") + "</p></div>" : "") +
        (info.fam && info.fam !== "—" ? '<div class="dict__row"><span>词性转换</span><p>' + info.fam + "</p></div>" : "") +
        (info.coll ? '<div class="dict__row"><span>固定搭配</span><p>' + info.coll + "</p></div>" : "") +
        (typeof ROOTS !== "undefined" && ROOTS[w] ? '<div class="dict__row"><span>词根</span><p>' + ROOTS[w] + "</p></div>" : "") +
        (typeof QUOTES !== "undefined" && QUOTES[w] ? '<div class="dict__quote"><p class="en">' + QUOTES[w].en + '</p><p class="zh">' + QUOTES[w].zh + " · " + QUOTES[w].src + "</p></div>" : "")
      : '<p class="dict__mean" style="color:var(--muted);font-size:14px;line-height:1.8">词库里还没有这个词的释义。已交卷的文章里每个词都可以点，但完整释义来自词库；可以先把它的形状记下来。</p>') +
    '<div class="sheet__mastery"><span>掌握度</span>' + masteryDots(p) + "<b>" + Math.round(p * 100) + "%</b></div>" +
    '<p class="sheet__hint">点空白处即可关闭</p>' +

      '<button class="btn btn--sm" data-act="addword" data-w="' + w + '">' + (on ? "已在生词本 · 点此移出" : "加入生词本") + "</button>" +
      '<button class="btn btn--sm btn--ghost" data-act="review-one" data-w="' + w + '">单独复习</button>' +
    "</div>";
}

/* ---------------- 错题本 ---------------- */
function skillStats() {
  const m = {};
  state.mistakes.forEach(function (x) { m[x.q.skill] = (m[x.q.skill] || 0) + 1; });
  return m;
}

function startDrill(skill) {
  const ids = Object.keys(QUESTIONS).filter(function (k) {
    return QUESTIONS[k].some(function (q) { return q.skill === skill; });
  });
  const id = ids.length ? ids[Math.floor(Math.random() * ids.length)] : "a1";
  state.drill = skill;
  state.read = null;
  closeSheet();
  navigate("#/read/" + id);
}

function viewMistakes() {
  state.mkFilter = state.mkFilter || "全部";
  const list = state.mistakes;
  const stats = skillStats();
  const total = list.length;
  const weak = Object.keys(stats).sort(function (a, b) { return stats[b] - stats[a]; })[0];
  const tabs = ["全部"].concat(Object.keys(stats).sort(function (a, b) { return stats[b] - stats[a]; }));
  const shown = state.mkFilter === "全部" ? list : list.filter(function (m) { return m.q.skill === state.mkFilter; });

  return `
  <div class="page">
    <div class="container">
      <div class="mk-top">
        <div>
          <p class="eyebrow">MISTAKE BOOK</p>
          <h1 class="mk-title">阅读错题本</h1>
          <p class="mk-sum">共 <b>${total}</b> 道${total ? " · 最薄弱 <b>" + weak + "</b>" : ""}</p>
        </div>
        ${total ? '<div class="mk-actions"><button class="btn" id="drillAll" type="button">按薄弱项练一篇</button></div>' : ""}
      </div>

      ${total ? '<div class="mk-tabs">' + tabs.map(function (k) {
        const n = k === "全部" ? total : (stats[k] || 0);
        return '<button class="mk-tab ' + (state.mkFilter === k ? "is-on" : "") + '" data-mk="' + k + '" type="button">' + k + "<span>" + n + "</span></button>";
      }).join("") + "</div>" : ""}

      ${shown.length ? shown.map(function (m) {
        const picked = m.picked != null ? "ABCD"[m.picked] : "—";
        return '<button class="mistake" data-m="' + state.mistakes.indexOf(m) + '" type="button">' +
          '<span class="mistake__dim">' + m.q.dim + " · " + m.q.skill + "</span>" +
          '<span class="mistake__stem">' + m.q.q + "</span>" +
          '<span class="mistake__meta">' + m.article + " · 你的答案 " + picked + " · 正确 " + "ABCD"[m.q.answer] + "</span>" +
          "</button>";
      }).join("") : '<div class="empty">这个类别还没有错题。</div>'}
    </div>
  </div>`;
}

function bindMistakes() {
  document.querySelectorAll("[data-mk]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.mkFilter = b.dataset.mk;
      render();
    });
  });
  const all = document.getElementById("drillAll");
  if (all) all.addEventListener("click", function () {
    const stats = skillStats();
    const weak = Object.keys(stats).sort(function (a, b) { return stats[b] - stats[a]; })[0];
    if (weak) startDrill(weak);
  });
  document.querySelectorAll("[data-drill]").forEach(function (b) {
    b.addEventListener("click", function () { startDrill(b.dataset.drill); });
  });
  document.querySelectorAll(".mistake").forEach(function (b) {
    b.addEventListener("click", function () {
      const m = state.mistakes[+b.dataset.m];
      if (!m) return;
      ensureOverlay();
      openSheet(
        '<p class="sheet__label">' + m.q.dim + " · " + m.q.skill + "</p>" +
        '<h2 class="sheet__word" style="font-size:20px;line-height:1.5">' + m.q.q + "</h2>" +
        '<p class="sheet__mean" style="font-size:13.5px;line-height:1.8">' + m.q.explain + "</p>" +
        '<div class="sheet__quote" style="border-left:3px solid var(--gold)">' + m.q.evidence + "</div>" +
        '<p class="sheet__note">来自《' + m.article + "》 · " + m.at + "</p>" +
        '<p class="sheet__hint">点空白处即可关闭</p>' +
        '<div class="sheet__actions"><a class="btn btn--sm" href="#/read/' + m.articleId + '" data-act="close">回到原文</a></div>'
      );
    });
  });
}

/* ---------------- 用户画像 ---------------- */
function viewProfile() {

  const dims = state.mistakeDims || {};
  const keys = Object.keys(dims).sort(function (a, b) { return dims[b] - dims[a]; });
  const lo = USER.c - USER.h, hi = USER.c + USER.h;
  const totalWrong = keys.reduce(function (n, k) { return n + dims[k]; }, 0);
  return `
  <div class="page">
    <div class="container">
      <div class="page-head">
        <h1>学习画像</h1>

      </div>
      <div class="profile-grid">
        <div class="panel">
          <h3>能力区间</h3>
          <div class="big">${lo}–${hi}<em>LX</em></div>

          <div class="meter"><i style="width:${USER.h <= 60 ? 88 : USER.h <= 100 ? 58 : 28}%"></i></div>
